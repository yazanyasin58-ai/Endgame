name: Build

# Push is limited to the default branch. A branch with an open pull request
# would otherwise match both triggers and build twice for the same commit.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idf-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: idf-site/.nvmrc
          cache: npm
          cache-dependency-path: idf-site/package-lock.json
      - run: npm ci
      - run: npm run build

      # Reports only — does not fail the build. While the site is in review,
      # unfilled slots are the expected state, so a gate here would be red on
      # every run. Turn this into a failing check at launch, when every slot
      # should carry real photography.
      #
      # Two numbers, because they answer different questions: renders is how
      # many places on the site are still holding space, slots is how many
      # distinct labelled slots exist. One photograph can fill several renders
      # — the kitchen appears on both the homepage and the gallery — and a
      # couple of slots share a file, so slots is an upper bound on the
      # photographs outstanding, not an exact count.
      - name: Report unfilled image slots
        run: |
          renders=$(grep -oh 'Reserved image slot' -r dist --include=*.html | wc -l)
          slots=$(grep -oh 'Reserved image slot: Reserved — [^"<]*' -r dist --include=*.html \
                  | sort -u | wc -l)
          echo "Slot renders still holding space: $renders"
          echo "Distinct labelled slots:          $slots"
